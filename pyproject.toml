[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-spl-research"
version = "0.2.0"
description = "Case-independent Bayesian false-passing detection for software product lines"
requires-python = ">=3.10"
dependencies = ["numpy==1.24.3", "scipy==1.10.1", "threadpoolctl==2.2.0"]

[project.optional-dependencies]
experiments = ["pandas==1.5.3", "scikit-learn==1.3.0", "javalang==0.13.0", "xlsxwriter==3.1.4", "matplotlib==3.7.1"]

[tool.setuptools.packages.find]
include = ["fp_research*"]
exclude = ["tests*"]
namespaces = false
