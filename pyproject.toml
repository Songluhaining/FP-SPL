[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-spl"
version = "0.2.0"
description = "Counterfactual causal identification of false-passing SPL configurations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
fp-spl = "cfp_spl.cli:main"

[tool.setuptools.packages.find]
include = ["cfp_spl*"]
